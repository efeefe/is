name: Build and Deploy Grav as SSG

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, zip, curl, gd, dom, fileinfo
          
      - name: Install Grav and Dependencies
        run: |
          wget https://github.com/getgrav/grav/releases/download/1.7.46/grav-v1.7.46.zip -O grav.zip
          unzip -q grav.zip
          mv grav grav-app
          cd grav-app
          
          # Replace default user folder with ours
          rm -rf user
          cp -r ../sites/is.efeefe.me user
          
          # Bypass composer version check by blanking platform_check.php files in the entire project
          find . -name "platform_check.php" -exec sh -c 'echo "<?php" > "$1"' _ {} \;
          
          # Install blackhole plugin for SSG generation
          echo "y" | bin/gpm install blackhole
          
          # Install other dependencies
          # We need to create an empty .dependencies file to bypass the error
          touch user/.dependencies
          bin/grav install || true
          
      - name: Generate Static Site
        run: |
          cd grav-app
          
          # Start internal PHP server in the background
          php -S localhost:8000 system/router.php > /dev/null 2>&1 &
          
          # Wait a few seconds for the server to be ready
          sleep 5
          
          # Generate the static site to a 'public' directory
          bin/plugin blackhole generate http://localhost:8000 --output-path=../public --assets
          
          # Debug: list generated files
          echo "=== public/ folder contents ==="
          ls -la ../public
          echo "==============================="
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
